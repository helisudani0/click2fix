name: release-appliance

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version tag (for example v1.2.0)"
        required: true
        type: string
      publish_latest:
        description: "Also update :latest image tags"
        required: true
        default: true
        type: boolean
      ova_url:
        description: "Optional HTTPS URL to a prebuilt click2fix-appliance-<version>.ova asset"
        required: false
        default: ""
        type: string

permissions:
  contents: write
  packages: write
  attestations: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
            PUBLISH_LATEST="${{ github.event.inputs.publish_latest }}"
            OVA_URL="${{ github.event.inputs.ova_url }}"
          else
            VERSION="${GITHUB_REF_NAME}"
            PUBLISH_LATEST="true"
            OVA_URL=""
          fi
          CLEAN="${VERSION#v}"
          OWNER_LC="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          REPO_LC="$(echo '${{ github.event.repository.name }}' | tr '[:upper:]' '[:lower:]')"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "clean=${CLEAN}" >> "$GITHUB_OUTPUT"
          echo "publish_latest=${PUBLISH_LATEST}" >> "$GITHUB_OUTPUT"
          echo "ova_url=${OVA_URL}" >> "$GITHUB_OUTPUT"
          echo "owner_lc=${OWNER_LC}" >> "$GITHUB_OUTPUT"
          echo "repo_lc=${REPO_LC}" >> "$GITHUB_OUTPUT"
          echo "backend_image=ghcr.io/${OWNER_LC}/${REPO_LC}-backend" >> "$GITHUB_OUTPUT"
          echo "frontend_image=ghcr.io/${OWNER_LC}/${REPO_LC}-frontend" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: image_tags
        run: |
          {
            echo "backend_version=${{ steps.meta.outputs.backend_image }}:${{ steps.meta.outputs.clean }}"
            echo "backend_latest=${{ steps.meta.outputs.backend_image }}:latest"
            echo "frontend_version=${{ steps.meta.outputs.frontend_image }}:${{ steps.meta.outputs.clean }}"
            echo "frontend_latest=${{ steps.meta.outputs.frontend_image }}:latest"
          } >> "$GITHUB_OUTPUT"

      - name: Create release output directory
        shell: bash
        run: |
          mkdir -p "deploy/releases/${{ steps.meta.outputs.version }}"

      - name: Build backend smoke image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/backend.Dockerfile
          load: true
          tags: click2fix-backend-smoke:${{ steps.meta.outputs.clean }}

      - name: Smoke test backend image imports
        shell: bash
        run: |
          docker run --rm \
            -e DATABASE_URL="sqlite:////tmp/click2fix-smoke.db" \
            -e JWT_SECRET="click2fix-smoke-secret-value-0123456789abcdef" \
            -e WAZUH_URL="https://wazuh.example.invalid" \
            -e WAZUH_USER="smoke-user" \
            -e WAZUH_PASSWORD="smoke-password" \
            -e INDEXER_URL="https://indexer.example.invalid" \
            -e INDEXER_USER="smoke-user" \
            -e INDEXER_PASSWORD="smoke-password" \
            -e C2F_AGENT_MANAGER_URL="http://agent-manager.example.invalid" \
            -e C2F_AGENT_MANAGER_CONTROL_TOKEN="smoke-agent-manager-token" \
            -e C2F_AGENT_MANAGER_BOOTSTRAP_TOKEN="smoke-agent-bootstrap-token" \
            -e C2F_ENROLLMENT_BOOTSTRAP_TOKEN="smoke-enrollment-token" \
            -e C2F_EVENT_INDEXER_URL="http://event-indexer.example.invalid" \
            -e C2F_EVENT_INDEXER_TOKEN="smoke-event-indexer-token" \
            -e C2F_INGEST_GATEWAY_URL="http://ingest-gateway.example.invalid" \
            -e C2F_INGEST_GATEWAY_TOKEN="smoke-ingest-token" \
            -e C2F_SOAR_SERVICE_URL="http://soar-service.example.invalid" \
            -e C2F_SOAR_SERVICE_TOKEN="smoke-soar-token" \
            -e C2F_AUDIT_HMAC_SECRET="smoke-audit-hmac-secret" \
            --entrypoint python \
            click2fix-backend-smoke:${{ steps.meta.outputs.clean }} \
            -c "import importlib; importlib.import_module('main'); print('backend import smoke passed')"

      - name: Verify tenant-governance route parity
        shell: bash
        run: |
          set -euo pipefail
          TENANT_GOV_FLAG="$(grep -E '^VITE_TENANT_GOVERNANCE_ENABLED=' deploy/appliance/.env.appliance.template | head -n1 | cut -d= -f2- || true)"
          TENANT_GOV_FLAG="$(echo "${TENANT_GOV_FLAG}" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"
          if [ "${TENANT_GOV_FLAG}" != "true" ] && [ "${TENANT_GOV_FLAG}" != "1" ] && [ "${TENANT_GOV_FLAG}" != "yes" ] && [ "${TENANT_GOV_FLAG}" != "on" ]; then
            echo "Tenant governance UI is disabled by default in appliance template; parity check skipped."
            exit 0
          fi

          FRONTEND_USES_V2_TENANTS="$(grep -R --line-number --include='*.js' --include='*.jsx' '/v2/tenants' frontend/src || true)"
          if [ -z "${FRONTEND_USES_V2_TENANTS}" ]; then
            echo "Frontend does not reference /v2/tenants; parity check skipped."
            exit 0
          fi

          echo "Frontend references /v2/tenants:"
          echo "${FRONTEND_USES_V2_TENANTS}"

          docker run --rm \
            -e DATABASE_URL="sqlite:////tmp/click2fix-smoke.db" \
            -e JWT_SECRET="click2fix-smoke-secret-value-0123456789abcdef" \
            -e WAZUH_URL="https://wazuh.example.invalid" \
            -e WAZUH_USER="smoke-user" \
            -e WAZUH_PASSWORD="smoke-password" \
            -e INDEXER_URL="https://indexer.example.invalid" \
            -e INDEXER_USER="smoke-user" \
            -e INDEXER_PASSWORD="smoke-password" \
            -e C2F_AGENT_MANAGER_URL="http://agent-manager.example.invalid" \
            -e C2F_AGENT_MANAGER_CONTROL_TOKEN="smoke-agent-manager-token" \
            -e C2F_AGENT_MANAGER_BOOTSTRAP_TOKEN="smoke-agent-bootstrap-token" \
            -e C2F_ENROLLMENT_BOOTSTRAP_TOKEN="smoke-enrollment-token" \
            -e C2F_EVENT_INDEXER_URL="http://event-indexer.example.invalid" \
            -e C2F_EVENT_INDEXER_TOKEN="smoke-event-indexer-token" \
            -e C2F_INGEST_GATEWAY_URL="http://ingest-gateway.example.invalid" \
            -e C2F_INGEST_GATEWAY_TOKEN="smoke-ingest-token" \
            -e C2F_SOAR_SERVICE_URL="http://soar-service.example.invalid" \
            -e C2F_SOAR_SERVICE_TOKEN="smoke-soar-token" \
            -e C2F_AUDIT_HMAC_SECRET="smoke-audit-hmac-secret" \
            --entrypoint python \
            click2fix-backend-smoke:${{ steps.meta.outputs.clean }} \
            -c "import importlib, sys; app = importlib.import_module('main').app; paths = {getattr(route, 'path', '') for route in app.routes}; ok = '/api/v2/tenants' in paths; print('backend_has_/api/v2/tenants=', ok); sys.exit(0 if ok else 1)"

      - name: Build and push backend image
        id: backend_build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/backend.Dockerfile
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.image_tags.outputs.backend_version }}

      - name: Attest backend image provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: ${{ steps.meta.outputs.backend_image }}
          subject-digest: ${{ steps.backend_build.outputs.digest }}
          push-to-registry: true

      - name: Build and push frontend image
        id: frontend_build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/frontend.Dockerfile
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.image_tags.outputs.frontend_version }}

      - name: Promote latest image tags
        if: ${{ steps.meta.outputs.publish_latest == 'true' }}
        shell: bash
        run: |
          docker buildx imagetools create \
            -t "${{ steps.image_tags.outputs.backend_latest }}" \
            "${{ steps.image_tags.outputs.backend_version }}"
          docker buildx imagetools create \
            -t "${{ steps.image_tags.outputs.frontend_latest }}" \
            "${{ steps.image_tags.outputs.frontend_version }}"

      - name: Attest frontend image provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: ${{ steps.meta.outputs.frontend_image }}
          subject-digest: ${{ steps.frontend_build.outputs.digest }}
          push-to-registry: true

      - name: Generate backend image SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.meta.outputs.backend_image }}:${{ steps.meta.outputs.clean }}
          format: spdx-json
          output-file: deploy/releases/${{ steps.meta.outputs.version }}/backend-image.spdx.json
          artifact-name: backend-image-sbom
          upload-artifact: false
          upload-release-assets: false

      - name: Generate frontend image SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.meta.outputs.frontend_image }}:${{ steps.meta.outputs.clean }}
          format: spdx-json
          output-file: deploy/releases/${{ steps.meta.outputs.version }}/frontend-image.spdx.json
          artifact-name: frontend-image-sbom
          upload-artifact: false
          upload-release-assets: false

      - name: Build installer bundle
        shell: pwsh
        run: |
          ./deploy/appliance/release/build-installer-bundle.ps1 `
            -Version "${{ steps.meta.outputs.version }}" `
            -Owner "${{ steps.meta.outputs.owner_lc }}" `
            -BackendImage "${{ steps.meta.outputs.backend_image }}" `
            -FrontendImage "${{ steps.meta.outputs.frontend_image }}" `
            -ImageTag "${{ steps.meta.outputs.clean }}"

      - name: Attest installer bundle
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: deploy/releases/${{ steps.meta.outputs.version }}/click2fix-appliance-installer-${{ steps.meta.outputs.version }}.zip

      - name: Download optional OVA asset
        if: ${{ steps.meta.outputs.ova_url != '' }}
        shell: bash
        run: |
          OVA_FILE="deploy/releases/${{ steps.meta.outputs.version }}/click2fix-appliance-${{ steps.meta.outputs.version }}.ova"
          curl --fail --location "${{ steps.meta.outputs.ova_url }}" --output "${OVA_FILE}"
          OVA_SHA="$(sha256sum "${OVA_FILE}" | awk '{print $1}')"
          printf "%s  %s\n" "${OVA_SHA}" "$(basename "${OVA_FILE}")" > "${OVA_FILE}.sha256"

      - name: Build release asset list
        id: assets
        shell: bash
        run: |
          OUT_DIR="deploy/releases/${{ steps.meta.outputs.version }}"
          OVA_FILE="${OUT_DIR}/click2fix-appliance-${{ steps.meta.outputs.version }}.ova"
          OVA_SHA="${OVA_FILE}.sha256"
          FILES=(
            "${OUT_DIR}/click2fix-appliance-installer-${{ steps.meta.outputs.version }}.zip"
            "${OUT_DIR}/click2fix-appliance-installer-${{ steps.meta.outputs.version }}.sha256"
            "${OUT_DIR}/backend-image.spdx.json"
            "${OUT_DIR}/frontend-image.spdx.json"
          )
          if [ -f "${OVA_FILE}" ]; then
            FILES+=("${OVA_FILE}")
          fi
          if [ -f "${OVA_SHA}" ]; then
            FILES+=("${OVA_SHA}")
          fi

          {
            echo "files<<EOF"
            for file in "${FILES[@]}"; do
              echo "${file}"
            done
            echo "EOF"
            if [ -f "${OVA_FILE}" ]; then
              echo "ova_attached=true"
            else
              echo "ova_attached=false"
            fi
          } >> "$GITHUB_OUTPUT"

      - name: Attest OVA asset
        if: ${{ steps.assets.outputs.ova_attached == 'true' }}
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: deploy/releases/${{ steps.meta.outputs.version }}/click2fix-appliance-${{ steps.meta.outputs.version }}.ova

      - name: Prepare release notes
        id: notes
        shell: bash
        run: |
          NOTES_FILE="deploy/releases/${{ steps.meta.outputs.version }}/RELEASE_NOTES.md"
          OVA_FILE="deploy/releases/${{ steps.meta.outputs.version }}/click2fix-appliance-${{ steps.meta.outputs.version }}.ova"
          HAS_OVA="false"
          if [ -f "${OVA_FILE}" ]; then
            HAS_OVA="true"
          fi
          cat > "${NOTES_FILE}" <<EOF
          Click2Fix appliance release: ${{ steps.meta.outputs.version }}

          Customer download:
          - click2fix-appliance-installer-${{ steps.meta.outputs.version }}.zip
          - click2fix-appliance-installer-${{ steps.meta.outputs.version }}.sha256
          EOF
          if [ "${HAS_OVA}" = "true" ]; then
            cat >> "${NOTES_FILE}" <<EOF
          - click2fix-appliance-${{ steps.meta.outputs.version }}.ova
          - click2fix-appliance-${{ steps.meta.outputs.version }}.ova.sha256
          EOF
          fi
          cat >> "${NOTES_FILE}" <<EOF

          Published images:
          - ${{ steps.meta.outputs.backend_image }}:${{ steps.meta.outputs.clean }}
          - ${{ steps.meta.outputs.frontend_image }}:${{ steps.meta.outputs.clean }}

          Supply-chain evidence:
          - backend-image.spdx.json
          - frontend-image.spdx.json
          - GitHub provenance attestations published for backend image, frontend image, installer bundle, and OVA when attached

          Quick install:
          1. Download installer zip from this release.
          2. Extract on target machine.
          3. Run setup.cmd (Windows) or setup.sh (Linux).
          4. Fill prompted Wazuh/indexer/endpoint credentials.
          EOF
          if [ "${HAS_OVA}" = "true" ]; then
            cat >> "${NOTES_FILE}" <<EOF

          OVA install path:
          1. Import click2fix-appliance-${{ steps.meta.outputs.version }}.ova into your hypervisor.
          2. Boot VM and complete the first-boot setup wizard in the VM console.
          EOF
          fi
          echo "path=${NOTES_FILE}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.version }}
          name: Click2Fix ${{ steps.meta.outputs.version }}
          body_path: ${{ steps.notes.outputs.path }}
          overwrite_files: true
          files: ${{ steps.assets.outputs.files }}
